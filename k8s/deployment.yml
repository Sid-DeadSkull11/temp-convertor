apiVersion: apps/v1
kind: Deployment

metadata:
  name: temp-convertor

spec:
  replicas: 2

  selector:
    matchLabels:
      app: temp-convertor

  template:
    metadata:
      labels:
        app: temp-convertor

    spec:
      containers:
        - name: temp-convertor
          image: siddeadskull11/temp-convertor:v2
          ports:
            - containerPort: 5000